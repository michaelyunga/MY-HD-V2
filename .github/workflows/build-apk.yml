name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la app web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/myhd/app
          cat > android/app/src/main/java/com/myhd/app/GallerySaverPlugin.java <<'JAVA'
          package com.myhd.app;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.io.IOException;
          @CapacitorPlugin(name = "GallerySaver")
          public class GallerySaverPlugin extends Plugin {
            private Uri pendingUri;
            private OutputStream stream;
            @PluginMethod public void begin(PluginCall call) {
              try {
                String name = call.getString("name", "MY-HD-video.mp4");
                ContentValues values = new ContentValues();
                values.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                values.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4");
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                  values.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/MY HD");
                  values.put(MediaStore.Video.Media.IS_PENDING, 1);
                }
                pendingUri = getContext().getContentResolver().insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values);
                if (pendingUri == null) throw new IOException("Android no pudo crear el archivo en la Galería");
                stream = getContext().getContentResolver().openOutputStream(pendingUri, "w");
                if (stream == null) throw new IOException("No se pudo abrir el archivo de destino");
                JSObject ret = new JSObject(); ret.put("ok", true); call.resolve(ret);
              } catch (Exception e) { cleanup(); call.reject("No se pudo preparar el guardado en Galería: " + e.getMessage(), e); }
            }
            @PluginMethod public void append(PluginCall call) {
              try {
                if (stream == null) throw new IOException("El guardado no está iniciado");
                String data = call.getString("data", "");
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                stream.write(bytes);
                call.resolve();
              } catch (Exception e) { call.reject("Error escribiendo video: " + e.getMessage(), e); }
            }
            @PluginMethod public void finish(PluginCall call) {
              try {
                if (stream == null || pendingUri == null) throw new IOException("No hay archivo pendiente");
                stream.flush(); stream.close(); stream = null;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                  ContentValues values = new ContentValues(); values.put(MediaStore.Video.Media.IS_PENDING, 0);
                  getContext().getContentResolver().update(pendingUri, values, null, null);
                }
                JSObject ret = new JSObject(); ret.put("saved", true); ret.put("uri", pendingUri.toString()); call.resolve(ret);
                pendingUri = null;
              } catch (Exception e) { cleanup(); call.reject("No se pudo finalizar el guardado: " + e.getMessage(), e); }
            }
            private void cleanup() {
              try { if (stream != null) stream.close(); } catch (Exception ignored) {}
              stream = null;
              try { if (pendingUri != null) getContext().getContentResolver().delete(pendingUri, null, null); } catch (Exception ignored) {}
              pendingUri = null;
            }
          }
          JAVA
          python3 - <<'PYCODE'
          p='android/app/src/main/java/com/myhd/app/MainActivity.java'
          s=open(p).read()
          if 'registerPlugin(GallerySaverPlugin.class)' not in s:
              s=s.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport com.myhd.app.GallerySaverPlugin;')
              s=s.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(GallerySaverPlugin.class);\n    }')
          open(p,'w').write(s)
          PYCODE

      - name: Icono de la app
        run: |
          pip install pillow --break-system-packages || pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          R = 'android/app/src/main/res'
          src = Image.open('icon-512.png').convert('RGBA')
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (l, f) in sizes.items():
              p = f'{R}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              src.resize((l, l), Image.LANCZOS).save(f'{p}/ic_launcher.png')
              src.resize((l, l), Image.LANCZOS).save(f'{p}/ic_launcher_round.png')
              src.resize((f, f), Image.LANCZOS).save(f'{p}/ic_launcher_foreground.png')
          os.makedirs(f'{R}/values', exist_ok=True)
          open(f'{R}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          PY

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MY-HD.apk

      - name: Guardar como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: MY-HD-apk
          path: MY-HD.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MY HD ${{ github.run_number }}
          files: MY-HD.apk
